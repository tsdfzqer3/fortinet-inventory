<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortinet 庫存監控系統 - Firebase即時版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen p-6">
    <div id="app"></div>
    <script>
        // ============ Firebase 設定區 ============
        const firebaseConfig = {
            apiKey: "AIzaSyBuvQ8pg6ZMESFqZrArO1s-fBv5mDd9NnA",
            authDomain: "fortinet-inventory.firebaseapp.com",
            databaseURL: "https://fortinet-inventory-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "fortinet-inventory",
            storageBucket: "fortinet-inventory.firebasestorage.app",
            messagingSenderId: "255369820814",
            appId: "1:255369820814:web:a627a81333bfdf3a0227df",
            measurementId: "G-DBXDQZY598"
        };

        // 初始化 Firebase
        let database;
        let firebaseInitialized = false;
        
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            database = firebase.database();
            firebaseInitialized = true;
            console.log('✅ Firebase 初始化成功');
            
            // 測試連線
            database.ref('.info/connected').on('value', (snapshot) => {
                if (snapshot.val() === true) {
                    state.firebaseConnected = true;
                    console.log('✅ Firebase 已連線');
                } else {
                    state.firebaseConnected = false;
                    console.log('⚠️ Firebase 未連線');
                }
                render();
            });
            
        } catch (error) {
            console.error('❌ Firebase 初始化失敗:', error);
            firebaseInitialized = false;
            state.firebaseConnected = false;
        }

        const SUPPLIER_CSV_URL = 'https://corsproxy.io/?' + encodeURIComponent('https://docs.google.com/spreadsheets/d/e/2PACX-1vTPXvFKAP0xi4WAW5EUaX-ZZt64Y8MJVZlPqpctzbNoQYsQmmHzt36MaMMby3d3qhDRZ4LN-wQAUc6p/pub?output=csv');
        
        let state={productCatalog:[],supplierStock:[],orderHistory:[],searchTerm:'',lowStockThreshold:10,filterZeroStock:false,lastSyncDate:null,supplierUpdateDate:null,orderUpdateDate:null,autoLoading:false,firebaseConnected:firebaseInitialized};
        const storage={get:k=>JSON.parse(localStorage.getItem(k)||'null'),set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
        
        // ============ Firebase 即時同步功能 ============
        function setupFirebaseListeners(){
            if(!firebaseInitialized)return;
            
            // 監聽料件清單變化
            database.ref('productCatalog').on('value', (snapshot) => {
                const data = snapshot.val();
                if(data){
                    // 轉換為陣列並按 order 排序
                    state.productCatalog = Object.values(data).sort((a, b) => (a.order || 0) - (b.order || 0));
                    storage.set('forti-product-catalog', state.productCatalog);
                    render();
                    console.log('📥 料件清單已更新（已排序）');
                }
            });
            
            // 監聽訂單記錄變化
            database.ref('orderHistory').on('value', (snapshot) => {
                const data = snapshot.val();
                if(data){
                    state.orderHistory = Object.values(data);
                    state.orderUpdateDate = new Date().toISOString();
                    storage.set('forti-order-history', state.orderHistory);
                    storage.set('forti-order-update', state.orderUpdateDate);
                    render();
                    console.log('📥 訂單記錄已更新');
                }
            });
        }
        
        async function syncToFirebase(type, data){
            if(!firebaseInitialized){
                console.log('Firebase 未初始化，資料僅保存在本地');
                return;
            }
            
            try{
                if(type === 'catalog'){
                    const catalogObj = {};
                    data.forEach((item, index) => {
                        catalogObj[item.itemCode || `item_${index}`] = item;
                    });
                    await database.ref('productCatalog').set(catalogObj);
                    console.log('✅ 料件清單已同步到 Firebase');
                }else if(type === 'orders'){
                    const ordersObj = {};
                    data.forEach((item, index) => {
                        ordersObj[item.id || `order_${index}`] = item;
                    });
                    await database.ref('orderHistory').set(ordersObj);
                    console.log('✅ 訂單記錄已同步到 Firebase');
                }
            }catch(error){
                console.error('❌ Firebase 同步失敗:', error);
                alert('雲端同步失敗，資料僅保存在本地\n錯誤：' + error.message);
            }
        }
        
        function loadData(){
            state.productCatalog=storage.get('forti-product-catalog')||[];
            state.supplierStock=storage.get('forti-supplier-stock')||[];
            state.orderHistory=storage.get('forti-order-history')||[];
            state.lastSyncDate=storage.get('forti-last-sync');
            state.supplierUpdateDate=storage.get('forti-supplier-update');
            state.orderUpdateDate=storage.get('forti-order-update');
            
            if(firebaseInitialized){
                setupFirebaseListeners();
            }
            
            if(state.productCatalog.length>0)autoLoadSupplierStock();
        }
        
        function extractModel(name){
            if(!name)return null;
            name=name.toUpperCase();
            let match=name.match(/F[GS]-\d+[A-Z]?/i);
            if(match)return match[0].toUpperCase();
            match=name.match(/FORTISWITCH-(\d+[A-Z\-]+)/i);
            if(match)return'FS-'+match[1].toUpperCase();
            match=name.match(/FORTIAP-(\d+[A-Z]+)/i);
            if(match)return'FAP-'+match[1].toUpperCase();
            match=name.match(/FORTIWIFI-(\d+[A-Z]+)/i);
            if(match)return'FWF-'+match[1].toUpperCase();
            match=name.match(/FORTIGATE-(\d+[A-Z]+)/i);
            if(match)return'FG-'+match[1].toUpperCase();
            return null;
        }
        
        function getMergedInventory(){
            const modelOrderTotals={};
            state.productCatalog.forEach(p=>{
                if(!modelOrderTotals[p.model]){modelOrderTotals[p.model]=0;}
            });
            state.orderHistory.forEach(order=>{
                const product=state.productCatalog.find(p=>p.itemCode===order.itemCode);
                if(product&&product.model){modelOrderTotals[product.model]+=order.quantity;}
            });
            return state.productCatalog.map(p=>{
                const s=state.supplierStock.find(x=>x.model===p.model);
                const stockQty=s?.quantity??null;
                const orderedQty=state.orderHistory.filter(o=>o.itemCode===p.itemCode).reduce((sum,o)=>sum+o.quantity,0);
                const modelTotalOrdered=modelOrderTotals[p.model]||0;
                const remainingQty=stockQty!==null?stockQty-modelTotalOrdered:null;
                return{...p,stockQty:stockQty,orderedQty:orderedQty,modelTotalOrdered:modelTotalOrdered,remainingQty:remainingQty,inTransit:s?.inTransit||'',stockNotes:s?.notes||''};
            });
        }
        
        async function autoLoadSupplierStock(){
            if(state.autoLoading)return;
            state.autoLoading=true;
            render();
            try{
                const response=await fetch(SUPPLIER_CSV_URL);
                if(!response.ok)throw new Error('無法載入CSV');
                const csvText=await response.text();
                const lines=csvText.trim().split('\n');
                const stock=[];
                const firstLine=lines[0];
                const updateDateMatch=firstLine.match(/\d{4}\/\d{1,2}\/\d{1,2}/);
                const supplierDate=updateDateMatch?updateDateMatch[0]:null;
                for(let i=1;i<lines.length;i++){
                    const cells=lines[i].match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g)||[];
                    const cleanCells=cells.map(s=>s.replace(/^"|"$/g,'').trim());
                    const model=cleanCells[0];
                    const stockStr=cleanCells[1];
                    const inTransit=cleanCells[2]||'';
                    const notes=cleanCells[4]||'';
                    if(model&&stockStr&&model!=='型號'){
                        const quantity=parseInt(stockStr)||0;
                        stock.push({id:`${model}-${Date.now()}-${i}`,model:model,quantity:quantity,inTransit:inTransit,notes:notes});
                    }
                }
                if(stock.length>0){
                    state.supplierStock=stock;
                    storage.set('forti-supplier-stock',stock);
                    state.lastSyncDate=new Date().toISOString();
                    storage.set('forti-last-sync',state.lastSyncDate);
                    if(supplierDate){
                        state.supplierUpdateDate=supplierDate;
                        storage.set('forti-supplier-update',supplierDate);
                    }
                    console.log('✅ 廠商庫存載入成功：'+stock.length+' 項');
                    render();
                }else{
                    alert('無法解析CSV資料');
                }
            }catch(error){
                alert('自動載入失敗：'+error.message);
            }finally{
                state.autoLoading=false;
                render();
            }
        }
        
        function handleStockSync(){
            if(confirm('確定要重新載入廠商庫存嗎？\n這會從 Google Sheets 抓取最新資料。')){
                autoLoadSupplierStock();
            }
        }
        
        function handleCatalogExcelUpload(e){
            const file=e.target.files[0];
            if(!file)return;
            const reader=new FileReader();
            reader.onload=function(event){
                try{
                    const data=new Uint8Array(event.target.result);
                    const workbook=XLSX.read(data,{type:'array',codepage:65001});
                    const firstSheet=workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData=XLSX.utils.sheet_to_json(firstSheet,{header:1,raw:false,defval:''});
                    processCatalogExcelData(jsonData);
                }catch(error){
                    alert('Excel檔案讀取失敗：'+error.message);
                }
            };
            reader.readAsArrayBuffer(file);
            e.target.value='';
        }
        
        function processCatalogExcelData(data){
            const existingCatalog=state.productCatalog;
            const newItems=[];
            const updatedItems=[];
            const skippedItems=[];
            const existingItemCodes=new Set(existingCatalog.map(p=>p.itemCode));
            for(let i=1;i<data.length;i++){
                const row=data[i];
                let itemCode=row[0];
                let productName=row[1];
                const specs=(row.length>7?row[7]:'')||'';
                if(typeof itemCode==='string')itemCode=itemCode.trim();
                else if(itemCode)itemCode=String(itemCode).trim();
                if(typeof productName==='string')productName=productName.trim();
                else if(productName)productName=String(productName).trim();
                let finalItemCode;
                if(!itemCode||itemCode===''||itemCode==='料號'){
                    finalItemCode=`未申請-${Date.now()}-${i}`;
                }else{
                    finalItemCode=itemCode;
                }
                if(productName&&productName!=='品名'){
                    const model=extractModel(productName);
                    if(model){
                        if(!finalItemCode.startsWith('未申請')&&existingItemCodes.has(finalItemCode)){
                            skippedItems.push(finalItemCode);
                            continue;
                        }
                        const newItem={id:`${finalItemCode}-${Date.now()}-${i}`,itemCode:finalItemCode,productName,model,specs:specs||'',notes:'',order:i};
                        newItems.push(newItem);
                        if(!finalItemCode.startsWith('未申請')){
                            existingItemCodes.add(finalItemCode);
                        }
                    }
                }
            }
            const mergedCatalog=[...existingCatalog,...newItems];
            if(newItems.length>0||updatedItems.length>0){
                state.productCatalog=mergedCatalog;
                storage.set('forti-product-catalog',mergedCatalog);
                
                // 🔥 即時同步到 Firebase
                syncToFirebase('catalog', mergedCatalog);
                
                let message='料件維護完成！\n';
                message+=`新增：${newItems.length} 項\n`;
                message+=`略過重複：${skippedItems.length} 項\n`;
                message+=`總計：${mergedCatalog.length} 項\n\n`;
                if(firebaseInitialized){
                    message+='✅ 已同步到雲端，所有人即時可見';
                }else{
                    message+='⚠️ 資料僅保存在本地（Firebase 未設定）';
                }
                if(skippedItems.length>0&&skippedItems.length<=5){
                    message+='\n\n略過的料號：\n'+skippedItems.join('\n');
                }else if(skippedItems.length>5){
                    message+='\n\n略過的料號：\n'+skippedItems.slice(0,5).join('\n')+'\n...等'+skippedItems.length+'項';
                }
                alert(message);
                render();
            }else{
                alert('未能匯入任何料件');
            }
        }
        
        function handleExcelUpload(e){
            const file=e.target.files[0];
            if(!file)return;
            const reader=new FileReader();
            reader.onload=function(event){
                try{
                    const data=new Uint8Array(event.target.result);
                    const workbook=XLSX.read(data,{type:'array',codepage:65001});
                    const firstSheet=workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData=XLSX.utils.sheet_to_json(firstSheet,{header:1,raw:false,defval:''});
                    processExcelData(jsonData);
                }catch(error){
                    alert('Excel檔案讀取失敗：'+error.message);
                }
            };
            reader.readAsArrayBuffer(file);
            e.target.value='';
        }
        
        function processExcelData(data){
            const merged=getMergedInventory();
            let successCount=0;
            let duplicateCount=0;
            let failedItems=[];
            const duplicateOrders=[];
            
            // 建立現有訂單的唯一鍵集合（採購單號 + 訂單單號 + 料號）
            const existingOrderKeys = new Set(
                state.orderHistory.map(o => `${o.poNumber}_${o.orderNumber}_${o.itemCode}`)
            );
            
            for(let i=1;i<data.length;i++){
                const row=data[i];
                const orderDate=row[1];                           // B欄：下單日期
                const poNumber=row[8]?.toString().trim()||'';     // I欄（索引8）：採購單號
                const itemCode=row[9]?.toString().trim();         // J欄（索引9）：料號
                const productName=row[10];                        // K欄（索引10）：採購品項
                const quantity=parseInt(row[11]);                 // L欄（索引11）：數量
                const orderNumber=row[15]?.toString().trim()||''; // P欄（索引15）：訂單單號
                
                // 基本驗證
                if(!itemCode||!quantity||isNaN(quantity)){
                    continue;
                }
                
                // 建立唯一鍵（採購單號_訂單單號_料號）
                const orderKey = `${poNumber}_${orderNumber}_${itemCode}`;
                
                // 檢查是否重複
                if(existingOrderKeys.has(orderKey)){
                    duplicateCount++;
                    duplicateOrders.push({
                        itemCode: itemCode,
                        poNumber: poNumber,
                        orderNumber: orderNumber,
                        quantity: quantity
                    });
                    continue;  // 跳過重複的訂單
                }
                
                // 檢查料號是否存在
                const product=merged.find(p=>p.itemCode===itemCode);
                if(product){
                    const order={
                        id:Date.now()+i,
                        itemCode:itemCode,
                        productName:productName||product.productName,
                        model:product.model,
                        quantity:quantity,
                        poNumber:poNumber,          // I欄：採購單號
                        orderNumber:orderNumber,    // P欄：訂單單號
                        notes:'批次匯入-'+(orderDate||''),
                        timestamp:new Date().toISOString()
                    };
                    state.orderHistory.push(order);
                    existingOrderKeys.add(orderKey);  // 加入已處理的訂單
                    successCount++;
                }else{
                    failedItems.push(itemCode);
                }
            }
            
            if(successCount>0||duplicateCount>0){
                if(successCount>0){
                    state.orderUpdateDate=new Date().toISOString();
                    storage.set('forti-order-history',state.orderHistory);
                    storage.set('forti-order-update',state.orderUpdateDate);
                    
                    // 🔥 即時同步到 Firebase
                    syncToFirebase('orders', state.orderHistory);
                }
                
                let message='訂單匯入完成！\n\n';
                message+=`✅ 成功匯入：${successCount} 筆\n`;
                if(duplicateCount>0){
                    message+=`⚠️ 略過重複：${duplicateCount} 筆\n`;
                }
                if(failedItems.length>0){
                    message+=`❌ 找不到料號：${failedItems.length} 筆\n`;
                }
                message+=`📊 總訂單數：${state.orderHistory.length} 筆\n`;
                
                if(firebaseInitialized){
                    message+='\n✅ 已同步到雲端，所有人即時可見';
                }else{
                    message+='\n⚠️ 資料僅保存在本地（Firebase 未設定）';
                }
                
                // 顯示重複訂單的詳細資訊（最多顯示5筆）
                if(duplicateCount>0&&duplicateOrders.length>0){
                    message+='\n\n重複的訂單（已略過）：';
                    duplicateOrders.slice(0,5).forEach(o=>{
                        message+=`\n• PO:${o.poNumber} | 訂單:${o.orderNumber} | ${o.itemCode} x${o.quantity}`;
                    });
                    if(duplicateOrders.length>5){
                        message+=`\n...等 ${duplicateOrders.length} 筆`;
                    }
                }
                
                // 顯示找不到的料號
                if(failedItems.length>0){
                    message+='\n\n找不到以下料號：\n'+failedItems.slice(0,5).join(', ');
                    if(failedItems.length>5){
                        message+=`\n...等 ${failedItems.length} 項`;
                    }
                }
                
                alert(message);
                render();
            }else{
                alert('未能匯入任何訂單\n\n可能原因：\n• 所有訂單都已存在（重複）\n• 找不到對應的料號');
            }
        }
        
        function viewOrderDetails(itemCode){
            const orders = state.orderHistory.filter(o => o.itemCode === itemCode);
            if(orders.length === 0){
                alert('此料號沒有訂單記錄');
                return;
            }
            
            let message = `料號：${itemCode}\n`;
            message += `訂單明細（共 ${orders.length} 筆）\n`;
            message += '='.repeat(50) + '\n\n';
            
            orders.forEach((order, index) => {
                message += `${index + 1}. `;
                if(order.orderNumber) message += `訂單號：${order.orderNumber} | `;
                if(order.poNumber) message += `PO：${order.poNumber} | `;
                message += `數量：${order.quantity}\n`;
                if(order.notes) message += `   備註：${order.notes}\n`;
                message += `   時間：${new Date(order.timestamp).toLocaleString('zh-TW')}\n\n`;
            });
            
            alert(message);
        }
        
        function clearAllOrders(){
            if(confirm('⚠️ 警告：此操作將清除所有採購訂單記錄！\n\n確定要繼續嗎？')){
                if(confirm('再次確認：真的要清除所有訂單嗎？\n此操作無法復原！')){
                    state.orderHistory=[];
                    state.orderUpdateDate=null;
                    storage.set('forti-order-history',[]);
                    storage.set('forti-order-update',null);
                    if(firebaseInitialized){
                        database.ref('orderHistory').remove();
                    }
                    alert('✓ 已清除所有訂單記錄');
                    render();
                }
            }
        }
        
        function clearAllCatalog(){
            if(confirm('⚠️ 警告：此操作將清除所有料件資料！\n\n確定要繼續嗎？')){
                if(confirm('再次確認：真的要清除所有料件嗎？\n此操作無法復原！')){
                    state.productCatalog=[];
                    storage.set('forti-product-catalog',[]);
                    if(firebaseInitialized){
                        database.ref('productCatalog').remove();
                    }
                    alert('✓ 已清除所有料件資料');
                    render();
                }
            }
        }
        
        function updateNotes(itemCode,notes){
            state.productCatalog=state.productCatalog.map(item=>item.itemCode===itemCode?{...item,notes:notes}:item);
            storage.set('forti-product-catalog',state.productCatalog);
            if(firebaseInitialized){
                syncToFirebase('catalog', state.productCatalog);
            }
        }
        
        function render(){
            const merged=getMergedInventory();
            const filtered=merged.filter(item=>{
                const search=state.searchTerm.toLowerCase();
                const match=item.itemCode.toLowerCase().includes(search)||item.productName.toLowerCase().includes(search)||item.model.toLowerCase().includes(search);
                const stock=!state.filterZeroStock||item.stockQty===null||item.stockQty>0;
                return match&&stock;
            });
            const zeroStock=merged.filter(i=>i.stockQty===0).length;
            const lowStock=merged.filter(i=>i.stockQty>0&&i.stockQty<=state.lowStockThreshold).length;
            
            const connectionStatus = state.firebaseConnected ? 
                '<span class="text-green-600 font-bold">🟢 即時連線</span>' : 
                '<span class="text-orange-600 font-bold">🟠 離線模式</span>';
